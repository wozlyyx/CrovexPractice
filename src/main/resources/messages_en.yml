    - "<gradient:#d400d4:#ff55ff><bold>Party Commands:</bold></gradient>"
    - "<yellow>/party create <gray>- Creates a party."
    - "<yellow>/party invite <player> <gray>- Invites a player."
    - "<yellow>/party accept <leader> <gray>- Accepts an invite."
    - "<yellow>/party leave <gray>- Leaves the party."
    - "<yellow>/party kick <player> <gray>- Kicks a player."
    - "<yellow>/party chat <message> <gray>- Party chat."
    - "<yellow>/party ffa <gray>- Starts Party FFA match."
    - "<yellow>/party split <gray>- Starts Party Split match."
    - "<yellow>/party challenge <leader> <gray>- Challenges another party."
