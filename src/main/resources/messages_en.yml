  both-set-hint-hover: "<yellow>Click → Save bounds and return to menu"

commands:
  no-permission: "<red>You do not have permission to use this command!"
  admin-help:
    - "<gradient:#ff5555:#ffaa00><bold>CrovexPractice Admin Commands:</bold></gradient>"
    - "<yellow>/cpractice admin <gray>- Opens arena management panel."
    - "<yellow>/cpractice createarena <name> <gray>- Creates a new arena."
    - "<yellow>/cpractice deletearena <name> <gray>- Deletes an arena."
    - "<yellow>/cpractice setup <name> <gray>- Gives selector wand and starts setup."
    - "<yellow>/cpractice savebounds <name> <gray>- Saves selected bounds for the arena."
    - "<yellow>/cpractice editlayout <unranked|ranked> <gray>- Modifies queue layout."
    - "<yellow>/cpractice kits <gray>- Opens kit management panel."
    - "<yellow>/cpractice createkit <name> <type> <gray>- Creates a new kit."
    - "<yellow>/cpractice deletekit <name> <gray>- Deletes a kit."
    - "<yellow>/cpractice setinv <name> <gray>- Saves kit items based on your inventory."
    - "<yellow>/cpractice seticon <name> <gray>- Saves kit icon based on held item."
    - "<yellow>/cpractice editinv <name> <gray>- Edits kit inventory visually."
    - "<yellow>/cpractice ffa <gray>- Opens FFA settings panel."
    - "<yellow>/cpractice setupffa <gray>- Gives FFA bounds selector wand."
    - "<yellow>/cpractice saveffabounds <gray>- Saves selected bounds for FFA."
    - "<yellow>/cpractice setlobbyspawn <gray>- Sets lobby spawn location."
    - "<yellow>/cpractice resetitems <gray>- Resets lobby items."
    - "<yellow>/cpractice reload <gray>- Reloads plugin configuration."
    - "<yellow>/leaderboard <gray>- Opens top 10 leaderboard."
