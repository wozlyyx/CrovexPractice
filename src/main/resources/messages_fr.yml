    - "<yellow>/cpractice editlayout <unranked|ranked> <gray>- Modifie la disposition de la file."
    - "<yellow>/cpractice kits <gray>- Ouvre le panneau de gestion des kits."
    - "<yellow>/cpractice createkit <nom> <type> <gray>- Crée un nouveau kit."
    - "<yellow>/cpractice deletekit <nom> <gray>- Supprime un kit."
    - "<yellow>/cpractice setinv <nom> <gray>- Enregistre les objets selon votre inventaire."
    - "<yellow>/cpractice seticon <nom> <gray>- Enregistre l'icône selon l'objet en main."
    - "<yellow>/cpractice editinv <nom> <gray>- Modifie visuellement l'inventaire du kit."
    - "<yellow>/cpractice ffa <gray>- Ouvre le panneau de configuration FFA."
    - "<yellow>/cpractice setupffa <gray>- Donne la baguette de limites FFA."
    - "<yellow>/cpractice saveffabounds <gray>- Enregistre les limites FFA."
    - "<yellow>/cpractice setlobbyspawn <gray>- Définit le point d'apparition du lobby."
    - "<yellow>/cpractice resetitems <gray>- Réinitialise les objets du lobby."
    - "<yellow>/cpractice reload <gray>- Recharge la configuration du plugin."
    - "<yellow>/leaderboard <gray>- Ouvre le top 10 du classement."
