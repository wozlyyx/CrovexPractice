    - "<gradient:#ff5555:#ffaa00><bold>Commandes Administrateur de CrovexPractice:</bold></gradient>"
    - "<yellow>/cpractice admin <gray>- Ouvre le panneau de gestion des arènes."
    - "<yellow>/cpractice createarena <nom> <gray>- Crée une nouvelle arène."
    - "<yellow>/cpractice deletearena <nom> <gray>- Supprime une arène."
