    - "<yellow>/cpractice setupffa <gray>- Fornisce la bacchetta selettore confini FFA."
    - "<yellow>/cpractice saveffabounds <gray>- Salva i confini selezionati per l'FFA."
    - "<yellow>/cpractice setlobbyspawn <gray>- Imposta la posizione di spawn della lobby."
    - "<yellow>/cpractice resetitems <gray>- Reimposta gli oggetti della lobby."
    - "<yellow>/cpractice reload <gray>- Ricarica la configurazione del plugin."
    - "<yellow>/leaderboard <gray>- Apre la classifica dei top 10."
