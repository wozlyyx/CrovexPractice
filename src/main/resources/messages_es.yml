commands:
  no-permission: "<red>¡No tienes permiso para usar este comando!"
  admin-help:
    - "<gradient:#ff5555:#ffaa00><bold>Comandos de Admin de CrovexPractice:</bold></gradient>"
    - "<yellow>/cpractice admin <gray>- Abre el panel de gestión de arenas."
    - "<yellow>/cpractice createarena <nombre> <gray>- Crea una nueva arena."
    - "<yellow>/cpractice deletearena <nombre> <gray>- Elimina una arena."
    - "<yellow>/cpractice setup <nombre> <gray>- Entrega la varita e inicia la configuración."
    - "<yellow>/cpractice savebounds <nombre> <gray>- Guarda los límites de la arena."
    - "<yellow>/cpractice editlayout <unranked|ranked> <gray>- Modifica el diseño de la cola."
    - "<yellow>/cpractice kits <gray>- Abre el panel de kits."
    - "<yellow>/cpractice createkit <nombre> <tipo> <gray>- Crea un nuevo kit."
    - "<yellow>/cpractice deletekit <nombre> <gray>- Elimina un kit."
    - "<yellow>/cpractice setinv <nombre> <gray>- Guarda los objetos según tu inventario."
    - "<yellow>/cpractice seticon <nombre> <gray>- Guarda el icono según el objeto en mano."
    - "<yellow>/cpractice editinv <nombre> <gray>- Edita el inventario visualmente."
    - "<yellow>/cpractice ffa <gray>- Abre el panel de FFA."
    - "<yellow>/cpractice setupffa <gray>- Entrega la varita de límites FFA."
    - "<yellow>/cpractice saveffabounds <gray>- Guarda los límites de FFA."
    - "<yellow>/cpractice setlobbyspawn <gray>- Establece el spawn del lobby."
    - "<yellow>/cpractice resetitems <gray>- Restablece los objetos del lobby."
    - "<yellow>/cpractice reload <gray>- Recarga las configuraciones del plugin."
    - "<yellow>/leaderboard <gray>- Abre la clasificación de los 10 mejores."
  party-help:
    - "<gradient:#d400d4:#ff55ff><bold>Comandos de Party:</bold></gradient>"
    - "<yellow>/party create <gray>- Crea una party."
    - "<yellow>/party invite <jugador> <gray>- Invita a un jugador."
    - "<yellow>/party accept <líder> <gray>- Acepta una invitación."
    - "<yellow>/party leave <gray>- Sale de la party."
    - "<yellow>/party kick <jugador> <gray>- Expulsa a un jugador."
    - "<yellow>/party chat <mensaje> <gray>- Chat de party."
    - "<yellow>/party ffa <gray>- Inicia partida Party FFA."
    - "<yellow>/party split <gray>- Inicia partida Party Split."
    - "<yellow>/party challenge <líder> <gray>- Desafía a otra party."
